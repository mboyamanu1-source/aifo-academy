<!DOCTYPE html>
<html>
<head>
  <title>Aifo Academy AI</title>
  <style>
    body {font-family: Arial; background: #111; color: white; padding: 20px;}
    #chat {max-width: 600px; margin: auto;}
    input, button {padding: 10px; font-size: 16px;}
    #messages {border: 1px solid #444; padding: 15px; height: 300px; overflow-y: scroll; margin-bottom: 10px;}
  </style>
</head>
<body>
  <div id="chat">
    <h1>Aifo Academy AI 🤖</h1>
    <div id="messages"></div>
    <input id="q" placeholder="Ask me anything..." style="width: 80%;">
    <button onclick="ask()">Send</button>
  </div>
<script>
async function ask() {
  let q = document.getElementById('q').value;
  let res = await fetch('/ask?q=' + q);
  let data = await res.json();
  document.getElementById('messages').innerHTML += "<b>You:</b> " + q + "<br><b>AI:</b> " + data.answer + "<br><br>";
  document.getElementById('q').value = '';
}
</script>
</body>
</html>
